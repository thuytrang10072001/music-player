name: CI for Develop Branch

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}

#    services:
#      postgres:
#        image: postgres:17
#        env:
#          POSTGRES_USER: ${{ env.DATABASE_USERNAME }}
#          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
#          POSTGRES_DB: ${{ env.DATABASE_NAME }}
#        ports:
#          - 5432:5432
#        options: >-
#          --health-cmd pg_isready
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & start services
        run: |
          docker compose -f docker-compose.yml up -d --build

      # ── Chờ DB sẵn sàng ─────────────────────────────────────────────────────
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U $DATABASE_USERNAME && break
            echo "Waiting for Postgres… ($i)"
            sleep 2
          done

      # ── Migrate (nếu cần) ────────────────────────────────────────────────────
      - name: Run migrations
        run: |
          docker compose exec -T backend php artisan migrate --force

      # ── Chạy test Laravel ───────────────────────────────────────────────────
      - name: Run Laravel tests
        run: |
          docker compose exec -T backend php artisan test

      # ── Chạy test React (nếu có) ────────────────────────────────────────────
      - name: Run React tests
        run: |
          docker compose exec -T music-player-react sh -c "npm ci && npm test -- --watchAll=false"

      # ── Tắt hết services ─────────────────────────────────────────────────────
      - name: Shutdown services
        if: always()
        run: docker compose -f docker-compose.yml down --volumes