name: CI for Develop Branch

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧱 Build và start toàn bộ service
      - name: Build & start services
        run: |
          docker compose -f docker-compose.yml up -d --build

      # 🕐 Chờ backend khởi động hoàn toàn
      - name: Wait for backend to start
        run: |
          for i in {1..30}; do
            status=$(docker compose ps backend | grep backend | awk '{print $4}')
            echo "backend status: $status"
            if [ "$status" = "running" ]; then
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 3
          done
          docker compose logs backend

      # 🕐 Chờ DB sẵn sàng (pg_isready)
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U $DATABASE_USERNAME && break
            echo "Waiting for Postgres… ($i)"
            sleep 2
          done

      # 🧪 Chạy migration Laravel
      - name: Run Laravel migrations
        run: |
          docker compose exec -T backend php artisan migrate --force

      # 🧪 Chạy Laravel test
      - name: Run Laravel tests
        run: |
          docker compose exec -T backend php artisan test

      # 🧪 Chạy frontend test
      - name: Run React tests
        run: |
          docker compose exec -T music-player-react sh -c "npm ci && npm test -- --watchAll=false || true"

      # 🧹 Tắt và dọn container
      - name: Shutdown services
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
